<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Stories</title><style>body{font:17px system-ui;background:#edf5f3;color:#183e39;margin:0;padding:24px}main{max-width:600px;margin:auto;background:white;padding:30px;border-radius:20px}label{display:block;margin:20px 0 6px}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;width:100%;border:1px solid #abc4bd;border-radius:8px}input[type=checkbox]{width:auto}button{margin-top:24px;background:#176555;color:white}video{width:100%;max-height:300px}small{display:block}#status{white-space:pre-wrap}</style><main><h1>A little video.<br>A big story.</h1><p>One short video. A little personality. A story worth sharing.</p><form id="form"><label>Your name<input name="person" required maxlength="100"></label><label>Pet name<input name="pet" required maxlength="100"></label><label>Animal ID (if known)<input name="animalId" maxlength="100"></label><label>Tell us about this moment<textarea name="story" maxlength="2000" rows="4" required></textarea></label><label>Video<input id="video" type="file" accept="video/*" required></label><small>Up to 30 seconds and 100 MB. 1080p preferred. No automatic compression.</small><video id="preview" controls hidden></video><label><input name="permission" type="checkbox"> I give permission to share this video publicly.</label><label>Test upload code<input name="code" type="password" required autocomplete="off"></label><button id="send">Upload video</button></form><p id="status" role="status"></p></main><script src="config.js"></script><script src="app.js"></script></html>
